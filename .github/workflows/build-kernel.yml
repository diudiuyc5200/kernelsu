name: Build Kernel
on:
  workflow_dispatch:
jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: true
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_MAXSIZE: 12G
      CONFIG_JSON: ${{ github.workspace }}/crux.config.json
    steps:
    - uses: actions/checkout@v4

    - name: Load config from json
      id: loadcfg
      run: |
        jq '.' ${{ env.CONFIG_JSON }}
        echo "KERNEL_NAME=$(jq -r '.kernelSource.name' ${{ env.CONFIG_JSON }})" >> $GITHUB_OUTPUT
        echo "KERNEL_REPO=$(jq -r '.kernelSource.repo' ${{ env.CONFIG_JSON }})" >> $GITHUB_OUTPUT
        echo "KERNEL_BRANCH=$(jq -r '.kernelSource.branch' ${{ env.CONFIG_JSON }})" >> $GITHUB_OUTPUT
        echo "KERNEL_DEVICE=$(jq -r '.kernelSource.device' ${{ env.CONFIG_JSON }})" >> $GITHUB_OUTPUT
        echo "KERNEL_DEFCONFIG=$(jq -r '.kernelSource.defconfig' ${{ env.CONFIG_JSON }})" >> $GITHUB_OUTPUT
        echo "ENABLE_CCACHE=$(jq -r '.enableCcache' ${{ env.CONFIG_JSON }})" >> $GITHUB_OUTPUT
        echo "USE_ANYKERNEL3=$(jq -r '.AnyKernel3.use' ${{ env.CONFIG_JSON }})" >> $GITHUB_OUTPUT
        echo "ENABLE_RESUKISU=$(jq -r '.enableKernelSU' ${{ env.CONFIG_JSON }})" >> $GITHUB_OUTPUT
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git jq ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-sax-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download toolchains
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        toolchains=$(jq -c '.toolchains[]' ${{ env.CONFIG_JSON }})
        echo "$toolchains" | while read -r tc; do
          name=$(echo "$tc" | jq -r '.name')
          repo=$(echo "$tc" | jq -r '.repo')
          branch=$(echo "$tc" | jq -r '.branch')
          binaryEnv=$(echo "$tc" | jq -r '.binaryEnv[]')
          git clone --recursive --depth=1 -j$(nproc) -b "$branch" "$repo" "$name"
          for sub in $binaryEnv; do
            echo "$GITHUB_WORKSPACE/kernel_workspace/$name/$sub" >> $GITHUB_PATH
          done
        done
        echo "==== Final PATH ===="
        echo "$PATH"

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive --depth=1 -j$(nproc) -b ${{ steps.loadcfg.outputs.KERNEL_BRANCH }} ${{ steps.loadcfg.outputs.KERNEL_REPO }} android-kernel

    - name: Setup ReSukiSU
      working-directory: ${{ github.workspace }}/kernel_workspace/android-kernel
      if: steps.loadcfg.outputs.ENABLE_RESUKISU == 'true'
      run: |
        echo ">>> Run ReSukiSU setup.sh lock commit 03b60f26"
        rm -rf drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/lsfqxd2006/ReSukiSU/main/kernel/setup.sh" | bash -s 03b60f26

        ls -la drivers/kernelsu
        echo ">>> Check defconfig ReSukiSU flags"
        grep -E "CONFIG_KSU" arch/arm64/configs/${{ steps.loadcfg.outputs.KERNEL_DEFCONFIG }}

    - name: Restore ccache cache
      if: steps.loadcfg.outputs.ENABLE_CCACHE == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: kernel-ccache-${{ steps.loadcfg.outputs.KERNEL_DEVICE }}
        restore-keys: |
          kernel-ccache-${{ steps.loadcfg.outputs.KERNEL_DEVICE }}

    - name: Generate make args (bash array zero‑delimited)
      id: genargs
      run: |
        PARAMS=$(jq '.params' ${{ env.CONFIG_JSON }})
        WORKSPACE=${{ github.workspace }}/kernel_workspace
        ARCH=$(echo "$PARAMS" | jq -r '.ARCH')
        CC=$(echo "$PARAMS" | jq -r '.CC')
        THREAD=$(nproc --all)

        args_arr=(
          "-j${THREAD}"
          "O=out"
          "ARCH=${ARCH}"
        )

        if [[ "$CC" == *"/"* ]];then
          CC="${WORKSPACE}/${CC}"
        fi

        if [ "${{ steps.loadcfg.outputs.ENABLE_CCACHE }}" = "true" ];then
          args_arr+=("CC=ccache ${CC}")
        else
          args_arr+=("CC=${CC}")
        fi

        while read -r line; do
          key=$(echo "$line" | cut -d= -f1)
          val=$(echo "$line" | cut -d= -f2‑)
          if [[ "$val" == *"/"* ]];then
            val="${WORKSPACE}/${val}"
          fi
          args_arr+=("${key}=${val}")
        done < <(jq -r '.externalCommands | to_entries[] | "\(.key)=\(.value)"' <<< "$PARAMS")

        printf '%s\0' "${args_arr[@]}" > $GITHUB_WORKSPACE/make_args.bin
        echo "ARGS_BIN=$GITHUB_WORKSPACE/make_args.bin" >> $GITHUB_OUTPUT

    - name: Build kernel
      working-directory: ${{ github.workspace }}/kernel_workspace/android-kernel
      run: |
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)

        mapfile -d '' args < ${{ steps.genargs.outputs.ARGS_BIN }}

        echo "==== MAKE ARGS dump ===="
        for p in "${args[@]}"; do
          echo "-> $p"
        done
        echo "======================="

        make "${args[@]}" ${{ steps.loadcfg.outputs.KERNEL_DEFCONFIG }}
        make "${args[@]}"

    - name: Check artifacts & md5sum
      id: checkart
      run: |
        cd ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot
        ls -lh
        md5sum Image Image.gz Image.gz-dtb dtbo.img || true
        echo "BUILD_OK=true" >> $GITHUB_ENV

    - name: Upload Image(raw kernel)
      uses: actions/upload-artifact@v4
      with:
        name: Image-${{ steps.loadcfg.outputs.KERNEL_DEVICE }}-${{ steps.loadcfg.outputs.BUILD_TIME }}
        path: ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/Image
        retention-days: 7

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb-${{ steps.loadcfg.outputs.KERNEL_DEVICE }}-${{ steps.loadcfg.outputs.BUILD_TIME }}
        path: ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb
        retention-days: 7

    - name: Upload dtb folder
      uses: actions/upload-artifact@v4
      with:
        name: dtb-folder-${{ steps.loadcfg.outputs.KERNEL_DEVICE }}-${{ steps.loadcfg.outputs.BUILD_TIME }}
        path: ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/dtb
        retention-days: 7

    - name: Upload dtbo.img
      uses: actions/upload-artifact@v4
      with:
        name: dtbo-img-${{ steps.loadcfg.outputs.KERNEL_DEVICE }}-${{ steps.loadcfg.outputs.BUILD_TIME }}
        path: ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/dtbo.img
        retention-days: 7

    - name: Build AnyKernel3 zip
      if: env.BUILD_OK == 'true' && steps.loadcfg.outputs.USE_ANYKERNEL3 == 'true'
      run: |
        cd ${{ github.workspace }}/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3 --depth=1
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        [ -f android-kernel/out/arch/arm64/boot/dtbo.img ] && cp android-kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        cd AnyKernel3
        zip -r ../AnyKernel3-${{ steps.loadcfg.outputs.KERNEL_DEVICE }}-${{ steps.loadcfg.outputs.BUILD_TIME }}.zip .

    - name: Upload AnyKernel3 zip
      if: env.BUILD_OK == 'true' && steps.loadcfg.outputs.USE_ANYKERNEL3 == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-zip-${{ steps.loadcfg.outputs.KERNEL_DEVICE }}-${{ steps.loadcfg.outputs.BUILD_TIME }}
        path: ${{ github.workspace }}/kernel_workspace/AnyKernel3-*.zip
        retention-days: 7
